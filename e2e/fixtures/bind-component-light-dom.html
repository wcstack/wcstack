<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>fixture: bind-component in Light DOM</title>
  <!-- Covers docs/architecture-hardening/15-state-component-mechanism-consistency.md §1.13.

       Everything §1.1-§1.12 verified was the Shadow DOM form. The Light DOM form existed only
       in the README, with no test and no example anywhere in the repo. Measured, the mapped form
       deadlocked: the host root's waitForStateInitialize waits on every <wcs-state> in the root,
       which in Light DOM includes the component's own; that one waits for the host's binding to
       the component element; and that binding is created by initializeBindings, which runs after
       waitForStateInitialize.

       Shadow DOM avoids this only because the inner state lives in a different rootNode -- the
       namespace separation was quietly providing initialization-order separation too. The fix
       restores both explicitly: the mapped Light DOM state is excluded from the host's wait, its
       subtree is pruned from the host's binding and structural-fragment passes, and the component
       scope binds itself once its name is registered.

       This page is the real-browser check, where custom-element upgrade timing differs from
       happy-dom. Both the plain form (state injection, which always worked) and the mapped form
       are on the page, plus a list crossing the boundary so the §1.8 row piggyback is exercised
       through the separated pass. -->
  <script type="module" src="/packages/state/dist/auto.min.js"></script>
  <style>
:not(:defined) { display: none; }
  </style>
  <script type="module">
    // Light DOM: shadow を使わず、要素直下に <wcs-state bind-component name="..."> を置く。
    // 名前空間が上位と共有されるため name は必須で、束縛は @name で明示する。
    function defineLight(tag, stateName, markup, initialState) {
      class LightComponent extends HTMLElement {
        state = structuredClone(initialState);
        connectedCallback() {
          if (this.childElementCount === 0) {
            this.innerHTML =
              `<wcs-state bind-component="state" name="${stateName}"></wcs-state>` + markup;
          }
        }
      }
      customElements.define(tag, LightComponent);
    }

    // mapped: ホストから data-wcs で束ねる（§1.13 でデッドロックしていた形）
    defineLight(
      "light-view",
      "lv",
      `<span class="inner" data-wcs="textContent: message@lv"></span>`,
      {}, // v2 R1（D19）
    );

    // mapped + list: 子スコープが親のリストを回す（§1.8 の相乗り経路）
    defineLight(
      "light-list",
      "ll",
      `<ul class="leaf-view"><template data-wcs="for: items@ll">` +
        `<li data-wcs="textContent: items.*.name@ll; attr.data-row-id: items.*.id@ll"></li>` +
        `</template></ul>`,
      {}, // v2 R1（D19）
    );

    // plain（配線なし）の Light DOM は v2 で廃止 — 専用ページ bind-component-light-dom-plain-removed.html でピン留め
  </script>
</head>
<body>
  <wcs-state>
    <script type="module">
export default {
  user: { name: "Alice" },
  rows: [{ id: "a", name: "Anna" }, { id: "b", name: "Ben" }],
  // パス文字列で書く（`this.rows[0].name = ...` は set トラップを通らない）
  rename() { this["user.name"] = "Carol"; },
  renameRow() { this["rows.1.name"] = "Bennett"; },
  replaceRows() { this.rows = [{ id: "x", name: "Xena" }, { id: "y", name: "Yuri" }]; },
};
    </script>
  </wcs-state>

  <div id="mapped">
    <light-view data-wcs="state.message: user.name"></light-view>
  </div>

  <div id="mapped-list">
    <light-list data-wcs="state.items: rows"></light-list>
  </div>



  <button id="rename" data-wcs="onclick: rename">rename</button>
  <button id="rename-row" data-wcs="onclick: renameRow">rename row</button>
  <button id="replace-rows" data-wcs="onclick: replaceRows">replace rows</button>
</body>
</html>
