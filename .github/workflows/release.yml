name: Release

# Two kinds of run (scripts/compute-next-version.mjs computes the version and
# holds the guards; "Plan the release" below refuses any other combination):
#
#   stable      patch / minor from X.Y.Z, or release (X.Y.Z-rc.N → X.Y.Z).
#               Runs from main only; npm dist-tag `latest`; pushes to main. A
#               new major reaches `latest` only through `release`, at the end of
#               an rc series, so `major` is always refused.
#   prerelease  premajor-rc (X.Y.Z → (X+1).0.0-rc.1) or prerelease-rc
#               (X.Y.Z-rc.N → X.Y.Z-rc.(N+1)). Runs only from
#               research/state-engine or a release/* branch; npm dist-tag
#               `next`; a GitHub prerelease; pushes back to the branch it ran on.
#
# The branch is frozen while a release runs: the run refuses to publish when the
# branch moved after it was dispatched, since the bump commit could no longer be
# pushed. Dispatch an rc with:
#   gh workflow run release.yml --ref research/state-engine -f version_type=premajor-rc
on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "patch / minor / release (rc.N → final): npm latest, from main. premajor-rc (→ X+1.0.0-rc.1) / prerelease-rc (rc.N → rc.N+1): npm next, from research/state-engine or release/*. major is refused (a new major goes through an rc series)."
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - premajor-rc
          - prerelease-rc
          - release

permissions:
  contents: write
  id-token: write

# One release at a time, whatever the branch: two runs would race for the npm
# versions and the tags. A second dispatch waits; it is never cancelled midway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No registry-url on purpose. It makes setup-node write an .npmrc whose
      # `_authToken=${NODE_AUTH_TOKEN}` expands to an empty string once the
      # token is gone, and npm reads that empty value as "auth is already
      # configured" and never starts the OIDC exchange — publishing then fails
      # with ENEEDAUTH (actions/setup-node#1551). registry.npmjs.org is npm's
      # default anyway, so dropping the input costs nothing.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/*/package-lock.json

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1, and Node 22 still
      # bundles npm 10.x. Upgrade the CLI only: the Node runtime stays on 22 so
      # build and test run on the same version ci.yml validated the PR against.
      - name: Upgrade npm CLI (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@11

      # Discover release-target packages, as one ordered set used for both
      # build and publish.
      #
      # Members: any packages/* scoped under @wcstack/, sorted. These have src,
      # tests, a package-lock.json and a dist. Auto-includes new packages;
      # excludes the vscode-wcs extension (published separately to the VS Code
      # Marketplace).
      #
      # The unscoped `wcstack` entry bundle is appended LAST, never sorted in:
      # its build inlines the member packages' dist/auto.min.js files
      # (state / router / fetch / storage / autoloader), so it must build after
      # every member has been (re)built — in BOTH passes, so "Test all
      # packages" tests a coherent bundle and the rebuild embeds the bumped
      # VERSION constants. Plain sorted order happens to satisfy that today,
      # but would break silently the moment a member sorting after "wcstack"
      # (websocket, worker, ...) joins the bundle profile, so the ordering is
      # explicit (docs/distribution-robustness-impl-plan.md D7). The entry
      # package builds and tests like any other package since plan Phase 4;
      # `list` and `publish_list` are now the same set, kept as two outputs so
      # the consuming steps stay unchanged.
      #
      # `state` is taken out of the sort and built FIRST, for the same reason:
      # `lint` (via its vscode-wcs build) and `typescript` inline state's
      # dist/parser.esm.js and dist/manifest.esm.js through file:../state, and
      # "lint" sorts before "state". Built in sorted order, lint read the
      # committed dist — the previous release's — so a parser export added in
      # this release failed the build (the first 2.6.0 attempt:
      # findV3MigrationIssues). ci.yml's wcs-validate job already builds state
      # first; this keeps the release in the same order.
      #
      # A `private: true` package is never published, so it is neither built,
      # tested, version-bumped, committed nor published here (its dist may be
      # gitignored, so `git add packages/<pkg>/dist` would fail, and its
      # test:coverage is not a release gate).
      - name: Discover packages
        id: discover
        run: |
          set -euo pipefail
          members() {
            for dir in packages/*/; do
              [ -f "${dir}package.json" ] || continue
              name=$(node -p "require('./${dir}package.json').name")
              private=$(node -p "require('./${dir}package.json').private === true")
              [ "$private" = "true" ] && continue
              case "$name" in
                @wcstack/state) ;;
                @wcstack/*) basename "$dir" ;;
              esac
            done | sort | tr '\n' ' '
          }
          pkgs="state $(members)wcstack "
          echo "Build/publish order: $pkgs"
          echo "list=$pkgs" >> "$GITHUB_OUTPUT"
          echo "publish_list=$pkgs" >> "$GITHUB_OUTPUT"

      # Compute the single unified target version — the highest current version
      # across the publish targets with the requested bump applied, so a lagging
      # package (a freshly added 1.0.0) is pulled onto the shared line — and
      # refuse, before any of the long steps, a run that would publish the wrong
      # thing:
      #   - the 4.0 engine (behaviorOptions in packages/state/dist/wcs-manifest.json)
      #     under a major below 4, or the 3.x engine under 4 or more;
      #   - a new major on `latest` other than through `release` (so `major`);
      #   - a stable release from a branch other than main (it goes to `latest`;
      #     before this guard a run from another branch pushed that branch's HEAD
      #     onto main);
      #   - a prerelease from anywhere but research/state-engine or release/*
      #     (main carries stable versions only — an rc commit there would make
      #     main's next 3.x patch start from the rc);
      #   - a bump that does not fit the current version (patch / minor / major
      #     on an rc: use `release`; prerelease-rc / release on a stable one), a
      #     prerelease-rc once v<X.Y.Z> is tagged, a target that is tagged already.
      # The script reads the tags (checkout's fetch-depth 0 fetched them all) and
      # prints the tag the release notes start from (previous_tag).
      # The unit tests run first: CI runs only on pull requests to main, so on an
      # rc branch this is the only place they run before a publish.
      # Then two checks of the world outside the tree, both repeated or settled
      # before anything is published:
      #   - the branch is still where the run was dispatched (the branch is frozen
      #     while a release runs — "Check the branch has not moved" repeats this
      #     right before the publish);
      #   - the target is on no registry yet. Its tag does not exist (the script
      #     refused that), so a package already at the target means a run that
      #     published and stopped before it pushed: re-running would publish the
      #     rest from a tree nobody tagged. Recovering from that needs a human.
      # The branch name reaches the scripts through the environment, never
      # through ${{ }} interpolation: a git ref may contain $( ) and backticks.
      - name: Plan the release
        id: plan
        run: |
          set -euo pipefail
          node --test --test-reporter=dot scripts/compute-next-version.test.mjs
          versions=$(
            for pkg in ${{ steps.discover.outputs.publish_list }}; do
              node -p "require('./packages/$pkg/package.json').version"
            done | tr '\n' ' '
          )
          echo "current_versions=$versions" >> "$GITHUB_OUTPUT"
          plan=$(node scripts/compute-next-version.mjs \
            --bump "${{ inputs.version_type }}" \
            --branch "$GITHUB_REF_NAME" --ref-type "$GITHUB_REF_TYPE" \
            --state-manifest packages/state/dist/wcs-manifest.json \
            $versions)
          printf '%s\n' "$plan" | tee -a "$GITHUB_OUTPUT"
          target=$(printf '%s\n' "$plan" | sed -n 's/^version=//p')

          remote=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME moved after this run was dispatched ($GITHUB_SHA → ${remote:-<gone>}). The branch is frozen while a release runs; dispatch again once it is quiet."
            exit 1
          fi

          published=""
          for pkg in ${{ steps.discover.outputs.publish_list }}; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            if [ "$(npm view "$name@$target" version 2>/dev/null || true)" = "$target" ]; then
              published="$published $name"
            fi
          done
          if [ -n "$published" ]; then
            echo "::error::$target is already on npm for:$published — but v$target is not tagged. A previous run published and stopped before it pushed (a partial release); this run will not publish the rest. Recovering needs a human: see CLAUDE.md (Release)."
            exit 1
          fi

      - name: Install dependencies
        run: |
          for pkg in ${{ steps.discover.outputs.list }}; do
            echo "::group::npm ci — $pkg"
            (cd "packages/$pkg" && npm ci)
            echo "::endgroup::"
          done

      - name: Build all packages
        run: |
          for pkg in ${{ steps.discover.outputs.list }}; do
            echo "::group::build — $pkg"
            (cd "packages/$pkg" && npm run build)
            echo "::endgroup::"
          done

      # "Plan the release" read the committed state dist, which lags src between
      # releases; the build above just replaced it. Plan again from the fresh
      # wcs-manifest.json so a stale committed dist cannot carry a run past the
      # engine guard. Only the engine guard can change its answer here: the
      # versions, the bump, the branch and the tags are the ones planned with,
      # so the target is the same whenever the script passes.
      - name: Re-check the plan against the fresh state build
        run: |
          set -euo pipefail
          node scripts/compute-next-version.mjs \
            --bump "${{ inputs.version_type }}" \
            --branch "$GITHUB_REF_NAME" --ref-type "$GITHUB_REF_TYPE" \
            --state-manifest packages/state/dist/wcs-manifest.json \
            ${{ steps.plan.outputs.current_versions }} > /dev/null

      # @wcstack/server's npm ci installs @wcstack/state from the registry, which
      # lags src until this very release is published — its tests would gate the
      # release against the previous release's state behavior. Link the sibling
      # build (fresh from "Build all packages" above) so the test loop sees
      # "fresh state × server", same as ci.yml's server matrix job.
      - name: Link sibling @wcstack/state into server (registry lags until publish)
        run: |
          rm -rf packages/server/node_modules/@wcstack/state
          mkdir -p packages/server/node_modules/@wcstack
          ln -s ../../../state packages/server/node_modules/@wcstack/state

      - name: Test all packages
        run: |
          for pkg in ${{ steps.discover.outputs.list }}; do
            echo "::group::test — $pkg"
            (cd "packages/$pkg" && npm run typecheck --if-present && npm run test:coverage)
            echo "::endgroup::"
          done

      # Pin every package to the target version "Plan the release" computed,
      # pulling any lagging packages (e.g. a freshly added 1.0.0) onto the
      # shared line. (The bump used to be computed here with `sort -V` and
      # `IFS=. read`, which cannot read a prerelease suffix.)
      - name: Bump versions
        id: bump
        run: |
          set -euo pipefail
          target="${{ steps.plan.outputs.version }}"
          echo "Bumping all packages from max ${{ steps.plan.outputs.current }} to $target"
          for pkg in ${{ steps.discover.outputs.publish_list }}; do
            (cd "packages/$pkg" && npm version "$target" --no-git-tag-version --allow-same-version)
          done
          # `npm version` rewrites only its own "version" field. Internal
          # @wcstack/* dependency ranges (server ships @wcstack/state as a
          # runtime dependency; testing declares state/server peers) keep their
          # old ranges and, across a major, would hand consumers a mismatched
          # pair at install time (e.g. server 2.0.0 + state 1.x, or an
          # unsatisfiable peer). Align them to the unified target: ^X.Y.Z, or the
          # exact version for an rc (rcs may still break each other, so an rc's
          # packages install only with the same rc). Lockfiles cannot follow
          # yet — the target versions reach the registry only at the publish
          # step below — so the lock sync runs right after publish and amends
          # the release commit before tagging.
          rewritten=$(node scripts/align-internal-dep-ranges.mjs "$target" \
            $(for pkg in ${{ steps.discover.outputs.publish_list }}; do printf 'packages/%s ' "$pkg"; done))
          echo "Internal @wcstack/* ranges aligned in: ${rewritten:-<none>}"
          echo "range_rewritten=$(echo $rewritten)" >> "$GITHUB_OUTPUT"
          echo "version=$target" >> "$GITHUB_OUTPUT"

      # Verify all packages now share the unified version.
      - name: Verify version consistency
        run: |
          set -euo pipefail
          expected="${{ steps.bump.outputs.version }}"
          for pkg in ${{ steps.discover.outputs.publish_list }}; do
            actual=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$actual" != "$expected" ]; then
              echo "::error::Version mismatch in $pkg: expected $expected, got $actual"
              exit 1
            fi
          done
          echo "All packages are at v$expected"

      # Rebuild after version bump so dist files embed the new VERSION constant
      # (`export const VERSION = pkg.version` is bundled at build time).
      - name: Rebuild after version bump
        run: |
          for pkg in ${{ steps.discover.outputs.list }}; do
            echo "::group::rebuild — $pkg"
            (cd "packages/$pkg" && npm run build)
            echo "::endgroup::"
          done

      # Last gate before publish: settable wcBindable member ⇒ declared in inputs.
      # Runs against the freshly rebuilt bundles, so src-introduced declaration
      # drift (the router navigateUrl / DCC $bindables class of bug) cannot ship
      # even though the CI job only sees committed dist.
      - name: Bindable settable-surface conformance (rebuilt dist)
        run: node scripts/conformance-bindable-inputs.mjs

      # The rebuilt wcstack bundle is excluded from both post-rebuild gates by
      # design: it has no dist/index.esm.js for the conformance script above
      # (plan D5) and is SKIPped by emit-builtin-tags below (plan D8). Re-run
      # its smoke tests against the freshly rebuilt dist — the tag census and
      # the zero-static-imports check are the only execution gates the
      # published bundle gets.
      - name: Smoke-test the rebuilt wcstack bundle
        run: npm test
        working-directory: packages/wcstack

      # Regenerate the builtinTags catalog + wcs.html-data.json from the freshly
      # rebuilt bundles and include them in the release commit. Without this, a
      # release that changed any wcBindable / observedAttributes surface would
      # commit new dist with a stale catalog, and the protocol-types-sync job's
      # emit-builtin-tags --check would fail on the next unrelated PR.
      - name: Regenerate builtin-tags catalog (rebuilt dist)
        run: node packages/vscode-wcs/scripts/emit-builtin-tags.mjs

      # Subresource Integrity digests for every package's single-tag bootstrap.
      #
      # Computed here, from the freshly rebuilt tree that is about to be
      # committed, tagged and published — deliberately not from a CDN response.
      # Asking the CDN for the hash of the file the CDN itself serves is
      # circular and defeats the point of SRI, which is to not have to trust it.
      #
      # This runs after the rebuild so the digests cover bundles carrying the
      # bumped VERSION constant, and before the artifact commit so a drifted
      # digest cannot reach the tag.
      - name: Generate SRI digests
        run: node scripts/generate-sri.mjs --version "${{ steps.bump.outputs.version }}" --out-json sri.json --out-notes sri-notes.md

      # Commit release artifacts locally so npm publish uses the same tree that will be tagged.
      # Add per discovered package rather than a packages/*/dist glob: building
      # @wcstack/lint leaves a freshly built packages/vscode-wcs/dist on the
      # runner, which is gitignored — a glob would name it explicitly and make
      # `git add` fail (the v1.22.1 first-attempt failure).
      - name: Commit release artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Every publish target got its version bumped, so every package.json is
          # staged. Lockfiles and dist exist only for the buildable set.
          for pkg in ${{ steps.discover.outputs.publish_list }}; do
            git add "packages/$pkg/package.json"
          done
          for pkg in ${{ steps.discover.outputs.list }}; do
            git add "packages/$pkg/package-lock.json" "packages/$pkg/dist"
          done
          # Generated from the rebuilt bundles above; committed together so the
          # emit-builtin-tags --check gate stays green after the release lands.
          git add packages/vscode-wcs/src/service/generated/builtinTags.generated.ts \
                  packages/vscode-wcs/wcs.html-data.json
          git commit -m "chore: bump all packages to v${{ steps.bump.outputs.version }}"

      # The last moment to back out: nothing is published yet. If the branch moved
      # since the dispatch (a merge during the build), the bump commit could not
      # be pushed after the publish, and npm would hold versions no tag records.
      # The branch is frozen while a release runs.
      - name: Check the branch has not moved
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME moved while this run built ($GITHUB_SHA → ${remote:-<gone>}). Nothing was published. The branch is frozen while a release runs; dispatch again once it is quiet."
            exit 1
          fi

      # Publish to npm. "Plan the release" refused a target that any package
      # already has on the registry (a partial release needs a human), so every
      # package is new here; the skip below only covers one published by hand
      # between the plan and this step.
      #
      # Auth is Trusted Publishing (OIDC): npm exchanges the workflow's id-token
      # (`permissions.id-token: write`, above) for a credential scoped to this
      # one publish. There is no token here to fall back to, so every package in
      # publish_list must have a trusted publisher registered for
      # wcstack/wcstack + release.yml — verify with
      # `node scripts/npm-trust-setup.mjs --verify`, which reads how each
      # package was actually published rather than how it is configured.
      # `--provenance` is not passed: a trusted publish attests automatically.
      # The registration pins the repository and this workflow's filename only
      # (no `environment`, and npm has no branch filter), so an rc run on a
      # branch other than main publishes the same way; its provenance names
      # that branch's commit.
      #
      # The dist-tag comes from the plan: `next` for an rc, `latest` otherwise.
      # The rc needs it: npm 11 refuses to publish a prerelease without --tag
      # ("You must specify a tag using --tag when publishing a prerelease
      # version"); older npm would have moved `latest` onto the rc.
      #
      # A package npm has never seen cannot have a trusted publisher — npm only
      # accepts the configuration for one that already exists — so a newly added
      # package needs a manual first publish before it can ride this workflow.
      # The guard below states that outright, because npm's bare ENEEDAUTH reads
      # as a broken workflow rather than as a missing setup step.
      - name: Publish to npm
        run: |
          set -euo pipefail
          target="${{ steps.bump.outputs.version }}"
          for pkg in ${{ steps.discover.outputs.publish_list }}; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            published=$(npm view "$name@$target" version 2>/dev/null || true)
            if [ "$published" = "$target" ]; then
              echo "::group::publish — $name (already at $target, skipping)"
            else
              if ! npm view "$name" version >/dev/null 2>&1; then
                echo "::error::$name is not on the registry yet, so it has no trusted publisher and this workflow cannot publish it. Publish its first version manually, then register it with scripts/npm-trust-setup.mjs --run."
                exit 1
              fi
              echo "::group::publish — $name (dist-tag ${{ steps.plan.outputs.dist_tag }})"
              (cd "packages/$pkg" && npm publish --access public --tag "${{ steps.plan.outputs.dist_tag }}")
            fi
            echo "::endgroup::"
          done

      # The bump step aligned internal @wcstack/* dependency ranges, but the
      # lockfiles could not follow at that point: the target versions reached
      # the registry only in the publish above. Sync them now and fold the
      # result into the release commit (amended before tagging) so the tagged
      # tree ships a consistent package.json + lock — otherwise the next
      # npm ci in each rewritten package fails on the mismatch. Retries cover
      # registry propagation lag right after publish.
      - name: Sync lockfiles for the aligned internal ranges
        if: ${{ steps.bump.outputs.range_rewritten != '' }}
        run: |
          set -euo pipefail
          for dir in ${{ steps.bump.outputs.range_rewritten }}; do
            for attempt in 1 2 3 4 5; do
              if (cd "$dir" && npm install --package-lock-only --no-audit --no-fund); then
                break
              elif [ "$attempt" = 5 ]; then
                echo "::error::lock sync failed in $dir after 5 attempts"
                exit 1
              else
                echo "registry not caught up for $dir (attempt $attempt); retrying in 15s"
                sleep 15
              fi
            done
            git add "$dir/package-lock.json"
          done
          git commit --amend --no-edit

      # Push only after all npm publishes succeed so git history and tags reflect a completed release.
      # The commit goes back to the branch the run is on: main for a stable
      # release (the plan refuses one from any other branch), the rc branch for
      # a prerelease (research/state-engine or release/*) — so main stays on
      # stable versions while an rc line is out. "Check the branch has not
      # moved" saw the branch at the dispatched commit just before the publish;
      # a push to it during the publish still fails this push (the branch is
      # frozen while a release runs).
      - name: Tag and push release
        run: |
          set -euo pipefail
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git push origin "v${{ steps.bump.outputs.version }}"

      # Create GitHub Release.
      #
      # The changelog is fetched from the release-notes API and concatenated
      # here rather than passed as --generate-notes alongside --notes-file.
      # The API documents that a supplied body is prepended to generated notes,
      # but that leaves the result depending on how gh forwards the two flags
      # together; building the body ourselves makes the order explicit and
      # cannot regress under a gh update. The tag already exists at this point
      # (pushed by the previous step), which is what generate-notes needs.
      #
      # sri.json rides along as an asset for tooling — and, being served from
      # GitHub rather than the CDN, it is the independent source that makes
      # verifying a jsDelivr response meaningful.
      #
      # The generated notes start from the tag the plan chose (previous_tag),
      # never from GitHub's guess: for an rc, the version it was bumped from
      # (v3.5.4 for rc.1, rc.N for rc.N+1); for a stable release, the last
      # stable tag — never an rc, so the notes of 4.0.0 cover the whole series.
      #
      # An rc is a GitHub prerelease (never marked "Latest"), and its notes open
      # with how to install it and where the changes are written: the CHANGELOG
      # keeps the draft under [Unreleased] for the whole rc series (it becomes
      # [X.Y.Z] only at the final release), plus the migration guide if any.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          tag="v$version"
          notes_args=(-f tag_name="$tag")
          previous="${{ steps.plan.outputs.previous_tag }}"
          if [ -n "$previous" ]; then
            notes_args+=(-f previous_tag_name="$previous")
          fi
          create_args=()
          : > release-notes.md
          if [ "${{ steps.plan.outputs.prerelease }}" = "true" ]; then
            create_args+=(--prerelease)
            major="${version%%.*}"
            blob="https://github.com/${{ github.repository }}/blob/$tag"
          cat > release-notes.md <<'NOTES'
          ## Release candidate

          A prerelease on npm's `next` dist-tag; `latest` is unchanged. Every `@wcstack/*` package and `wcstack` are at @VERSION@ there:

          ```sh
          npm i @wcstack/state@next
          ```

          - What changes: the `[Unreleased]` section of [CHANGELOG.md](@BLOB@/CHANGELOG.md), the draft of @BASE@.
          NOTES
            if [ -f "docs/migration-v$major.md" ]; then
              printf -- '- Upgrading from %s.x: [docs/migration-v%s.md](%s/docs/migration-v%s.md).\n' \
                "$((major - 1))" "$major" "$blob" "$major" >> release-notes.md
            fi
            sed -i "s|@VERSION@|$version|g; s|@BLOB@|$blob|g; s|@BASE@|${version%%-*}|g" release-notes.md
            printf '\n---\n\n' >> release-notes.md
          fi
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            "${notes_args[@]}" \
            --jq .body > generated-notes.md
          cat sri-notes.md >> release-notes.md
          printf '\n---\n\n' >> release-notes.md
          cat generated-notes.md >> release-notes.md
          gh release create "$tag" \
            --title "$tag" \
            --notes-file release-notes.md \
            "${create_args[@]}" \
            sri.json
