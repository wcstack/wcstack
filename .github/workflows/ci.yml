name: CI

on:
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The selection rules live in scripts/verify.mjs, which a local run uses too, so CI and a
      # branch without CI select the same packages (docs/verification-practices-study.md §2.3; the
      # bash it replaced selected the same packages for each of the 300 merges before it).
      # Diff against the PR base SHA from the event payload. HEAD is the PR merge ref built on this
      # same SHA, so it is always present locally (fetch-depth: 0) and the diff is exactly the PR's
      # changes. The previous `git fetch --depth=1` + `git merge-base origin/main` approach raced
      # with pushes to the base branch: when main advanced during the run, the shallow fetch grafted
      # the new tip with clipped parents and merge-base exited 1 without output (PR #77's run).
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          packages=$(node scripts/verify.mjs --base "${BASE_SHA:?not a pull_request event}" --head HEAD --list --json)
          echo "selected: $packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  gate-changes:
    # A pull request can change every input of the gates that judge it: the state size and
    # coupling baselines (a slack included), the limits in the gate scripts, the coverage
    # thresholds, a coverage exclusion in a source file, the e2e retry policy, the workflows
    # (docs/verification-practices-study.md §2.1). Such a change is often right — a new add-on
    # needs a baseline entry — but it is the author's decision, and it must be seen: this job lists
    # what the pull request touches in them, in the job summary and as notices on the files.
    # Observe mode: it never fails. The state job below also runs the base's size gate over the
    # pull request's build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/gate-changes.mjs --base "${BASE_SHA:?not a pull_request event}"

  protocol-types-sync:
    # Content mirrored from a single canonical source into many files — copies of
    # source files that live outside packages/* (protocol/wc-bindable.ts →
    # src/protocol/wcBindable.ts, config-templates/* → rollup.config.js /
    # eslint.config.js), and the per-package README AI-agents banner (canonical
    # text in scripts/sync-readme-agents-banner.mjs). The change-detection matrix
    # above cannot catch this drift, so this independent job fails if any mirror
    # drifts from its source (including a new package that ships without the banner).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-protocol-types.mjs --check
      - run: node scripts/sync-io-core.mjs --check
      - run: node scripts/sync-package-configs.mjs --check
      - run: node scripts/sync-readme-agents-banner.mjs --check
      # The mistake catalogue (docs/mistake-catalogue.md): every lint code is
      # catalogued, a shared runtime code still exists in a runtime package's src,
      # and the rendered tables match scripts/mistake-catalogue.json.
      - run: node scripts/sync-mistake-catalogue.mjs --check
      # What the READMEs describe before npm has it is marked with its version
      # ("Since 4.3 (not released yet)"), and a version not yet released is never
      # written without the mark (docs/v4-direction-2026-10.md §5.1, ja).
      - run: node --test scripts/unreleased-marks.test.mjs
      - run: node scripts/unreleased-marks.mjs --check
      # builtinTags カタログ + wcs.html-data.json が committed dist からの再生成と
      # 一致するか(audio/midi 追加時に 12 タグ分 stale だった鮮度罠の恒久ゲート)。
      # committed dist が入力なので npm ci 不要・src が dist より先行していても安定。
      - run: node packages/vscode-wcs/scripts/emit-builtin-tags.mjs --check

  release-plan:
    # The release planning release.yml runs before it publishes (version bump,
    # npm dist-tag, the branch / engine guards, internal range alignment):
    # tested here so a broken rule fails a PR rather than a release. release.yml
    # runs the same tests again, since an rc branch gets no CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/compute-next-version.test.mjs

  bindable-conformance:
    # settable wcBindable member ⇒ declared in inputs. A runtime check that
    # imports each package's committed dist bundle and inspects the *evaluated*
    # declaration against the prototype chain's setters — so dynamically
    # generated wcBindable surfaces are covered too, which no source lint can
    # see (the router navigateUrl / DCC $bindables class of drift). Committed
    # dist lags src between releases; release.yml re-runs the same script after
    # the version-bump rebuild so fresh bundles are re-gated before publish.
    # This job installs nothing, so a bundle importing an external bare
    # specifier (server externalizes happy-dom) is skipped here with a note and
    # fully checked in the release.yml re-run, which follows per-package npm ci.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/conformance-bindable-inputs.mjs

  wcs-validate:
    # Phase 5a 静的契約の CI ゲート。vscode-wcs の validator core を wcs-validate CLI
    # 経由で repo の HTML / sidecar manifest に適用し、error severity の診断があれば
    # build を落とす（spread 構文 / path / modifier / 壊れ manifest 等）。
    # <wcs-state src=...> の外部 state は CLI が HTML 相対で読み込んで解決する。
    # それでも解決できないパスは warning に留まり build を落とさない（--errors-only で表示も抑制）。
    # vscode-wcs は @wcstack/* でなく detect-changes matrix 対象外なので独立 job にする。
    #
    # vscode-wcs / lint は @wcstack/state の dist（parser / manifest）を file:../state（symlink）経由で
    # inline して消費する。コミット済み dist はリリース間で src に遅行するため、最初に
    # state を src から再ビルドし、「新鮮な state × vscode-wcs / lint」を PR 時点で
    # ゲートする（#183 の残り半分 — stale dist に対して緑のまま release で初めて落ちる
    # 経路を塞ぐ。docs/distribution-robustness-impl-plan.md Phase 2）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/vscode-wcs/package-lock.json
            packages/state/package-lock.json
      # node_modules/@wcstack/state は npm の file: 依存で symlink になるため、
      # vscode-wcs の npm ci より先に走っても後から走っても新鮮な dist が見える。
      # esbuild の inline（vscode-wcs の build）より前であることだけが要件。
      - name: Build @wcstack/state from source (vscode-wcs and lint inline its dist)
        run: |
          npm ci
          npm run build
        working-directory: packages/state
      - run: npm ci
        working-directory: packages/vscode-wcs
      - run: npm run build
        working-directory: packages/vscode-wcs
      # vscode-wcs は detect-changes matrix 対象外のため、ユニットテスト
      # （コーパスパリティテスト含む — examples の HTML 追加が正本パーサ基盤を
      # 壊していないかのゲート）はこの job で実行する。
      - run: npm test
        working-directory: packages/vscode-wcs
      # @wcstack/lint はソースを持たず、vscode-wcs をビルドして cli.cjs をコピーする
      # だけのラッパー。挙動の正本は vscode-wcs にあるのに CLI 契約テストは lint 側に
      # あり、その ci matrix は「packages/lint/ が変更された PR」でしか動かない。
      # vscode-wcs は @wcstack/* でないので matrix にそもそも載らず、vscode-wcs だけを
      # 触る変更は lint の契約テストを一度も走らせないまま通る。実際 array-mutation の
      # severity 変更がこの穴を抜け、release の「Build all packages」で初めて落ちた。
      # vscode-wcs の変更で必ず動くこの job から走らせて塞ぐ。冒頭の state 再ビルドに
      # より、この smoke も state の src 変更に対して新鮮な dist で走る。
      - name: Smoke-test the packaged CLI against the freshly built dist
        run: |
          set -euo pipefail
          npm run build
          npm test
        working-directory: packages/lint
      # @wcstack/typescript は lint と同型: wcs-schema の自己検査と end-to-end テストが
      # vscode-wcs から bundle した validator core（dist/schema-core.cjs）を使う。matrix の
      # typescript job は packages/typescript/ を触る PR でしか動かないので、vscode-wcs の変更・
      # state の src 変更に対しては「新鮮な state × vscode-wcs × typescript」をここでゲートする。
      - name: Build and test @wcstack/typescript against the freshly built validator core
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm test
        working-directory: packages/typescript
      # @wcstack/testing links @wcstack/server (file:../server) and reuses its
      # waitForReady; its build rebuilds server from source, so this step gates
      # "fresh server × testing" on every run (a server-only PR does not trigger the
      # testing matrix job).
      - name: Build and test @wcstack/testing against the freshly built server
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm test
        working-directory: packages/testing
      # wcs-tsc over every example page. Experimental and NON-GATING for one
      # release (docs/app-testing-and-typescript-impl-plan.md §7-6): the goal is
      # zero false positives over examples/ before it becomes a gate. Remove
      # continue-on-error once a release cycle shows a clean run.
      - name: Type-check <wcs-state> inline scripts in examples with wcs-tsc (experimental, non-gating)
        continue-on-error: true
        run: |
          set -euo pipefail
          node packages/typescript/dist/wcs-tsc.mjs -p examples/tsconfig.wcs-tsc.json
      - name: Validate data-wcs bindings (error severity fails the build)
        run: |
          set -euo pipefail
          # test-fixture holds pages that are broken on purpose, for opening by
          # hand in the extension. referenceIndex.test.ts's corpus walk skips it
          # for the same reason; this scan has to agree, or a deliberately bad
          # page fails the build the moment a new diagnostic starts catching it.
          find examples packages \
            -type d \( -name node_modules -o -name dist -o -name coverage -o -name .tsc-out -o -name test-fixture \) -prune \
            -o -type f \( -name '*.html' -o -name '*.manifest.json' \) -print0 \
            | xargs -0 -r -n 100 node packages/vscode-wcs/dist/cli.cjs --errors-only

  ci:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json
      - run: npm ci
      # @wcstack/server renders with the state runtime it declares as a registry
      # dependency, but the published state lags src between releases — after a
      # state behavior change, server's v-next tests would run against the v-old
      # registry install and fail (or worse, pass against stale behavior). Same
      # #183-shaped gap wcs-validate closes for vscode-wcs/lint; local checkouts
      # don't see it because node_modules/@wcstack/state is typically a symlink
      # to the sibling package. Build the sibling from source and link it in.
      - name: Build @wcstack/state from source (server consumes its dist; the registry install lags src)
        if: ${{ matrix.package == 'server' }}
        working-directory: packages/state
        run: |
          npm ci
          npm run build
      - name: Link the freshly built state into server's node_modules
        if: ${{ matrix.package == 'server' }}
        run: |
          rm -rf node_modules/@wcstack/state
          mkdir -p node_modules/@wcstack
          ln -s ../../../state node_modules/@wcstack/state
      # The wcstack bundle inlines each member's committed dist/auto.min.js, and
      # those dists are only rebuilt at release — so without this the job would
      # gate a bundle built from last release's members and stay green while the
      # release build breaks. detect-changes selects this job for a member-only
      # PR too, so every member is rebuilt here, not just state: rebuilding one
      # of five would leave the other four whiffing exactly when they are the
      # reason the job was selected. The members are file:../ dependencies, which
      # npm installs as symlinks, so the fresh dist is what `npm run build` below
      # picks up with no re-linking.
      - name: Build the bundled members from source (their committed dist lags src)
        if: ${{ matrix.package == 'wcstack' }}
        run: |
          set -euo pipefail
          members=$(node -p "Object.values(require('./package.json').devDependencies).filter((v) => v.startsWith('file:../')).map((v) => v.slice(8)).join(' ')")
          echo "rebuilding: $members"
          for member in $members; do
            ( cd "../$member" && npm ci && npm run build )
          done
      - run: npm run lint
      - run: npm run build
      # Size gate for the shipped files of @wcstack/state 4.0 (requirements N2 / N3, D18): the
      # full entries, the split core with its chunks, each add-on and split/auto.js beyond the core
      # may not grow more than 3 % gzip (plus an entry's optional slack) over
      # scripts/state-size-baseline.json, re-recorded with --update at each release; and two
      # absolute limits — dist/core.min.js <= 20,480 B (20 KiB) gzip (the 4.0 core target) and the
      # `/define` helper entry <= 1,024 B. Reads dist only, so it runs after the build.
      - name: Check the shipped sizes of @wcstack/state against the release baseline and the core target
        if: ${{ matrix.package == 'state' }}
        run: node ../../scripts/check-state-size.mjs --check
      # The step above judges the build by the pull request's own gate, which the pull request can
      # change: its limits, its baseline, a slack (docs/verification-practices-study.md §2.1). Judge
      # the same build by the base's gate too — the base's script and baseline, over this dist — and
      # say in the job summary whether it passes. Observe mode: it never fails the job; a pull request
      # that passes only by moving its own gate shows here, next to gate-changes' list.
      - name: Judge the build by the base's size gate too (observe)
        if: ${{ matrix.package == 'state' && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          base="$RUNNER_TEMP/base-gate"
          mkdir -p "$base/scripts" "$base/packages/state"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:scripts/check-state-size.mjs" > "$base/scripts/check-state-size.mjs"
          git show "$BASE_SHA:scripts/state-size-baseline.json" > "$base/scripts/state-size-baseline.json"
          # (the script reads ../packages/state/dist from where it is: this build's dist)
          ln -s "$GITHUB_WORKSPACE/packages/state/dist" "$base/packages/state/dist"
          out=$(node "$base/scripts/check-state-size.mjs" --check 2>&1); code=$?
          echo "$out"
          {
            if [ "$code" -eq 0 ]; then echo "### The base's size gate: this build passes it"
            else echo "### The base's size gate: this build does not pass it (observe mode)"; echo
              echo "The pull request's own gate passed, so it changed the gate. Say which decision in the pull request."
            fi
            echo; echo '```'; echo "$out" | grep -E 'core.min.js|EXCEEDED|refus|missing'; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Structure gate (requirement B13, wiring design §7-1): bundles src with esbuild in memory
      # and checks that each add-on carries only its own code beyond the core chunk, that the core
      # entries reach no add-on, that `/define` imports nothing, and that the core <-> add-on
      # imports and the modules that run code on evaluation match
      # scripts/state-coupling-baseline.json. Needs this package's node_modules (esbuild,
      # typescript); compares the split entries with the freshly built dist/split.
      - name: Check the core / add-on structure of @wcstack/state against its baseline
        if: ${{ matrix.package == 'state' }}
        run: node ../../scripts/check-state-coupling.mjs --check
      - run: npm run typecheck --if-present
      - run: npm run size --if-present
      - run: npm run test:coverage
