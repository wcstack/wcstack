name: CI

on:
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Discover CI-target packages: any packages/* whose package.json is
          # scoped under @wcstack/, plus the unscoped `wcstack` entry bundle
          # (a buildable package since docs/distribution-robustness-impl-plan.md
          # Phase 4). Auto-includes new scoped packages; still excludes
          # non-published ones (e.g. the vscode-wcs extension).
          all=()
          for dir in packages/*/; do
            [ -f "${dir}package.json" ] || continue
            name=$(node -p "require('./${dir}package.json').name")
            case "$name" in
              @wcstack/*) all+=("$(basename "$dir")") ;;
              wcstack)    all+=("$(basename "$dir")") ;;
            esac
          done

          # Diff against the PR base SHA from the event payload. HEAD is the PR
          # merge ref built on this same SHA, so it is always present locally
          # (fetch-depth: 0) and the diff is exactly the PR's changes. The
          # previous `git fetch --depth=1` + `git merge-base origin/main`
          # approach raced with pushes to the base branch: when main advanced
          # during the run, the shallow fetch grafted the new tip with clipped
          # parents and merge-base exited 1 without output (PR #77's run).
          changed=$(git diff --name-only "${BASE_SHA:?not a pull_request event}" HEAD)

          # A change to the shared root tsconfig rebuilds every package.
          if echo "$changed" | grep -qx 'tsconfig.json'; then
            selected=("${all[@]}")
          else
            selected=()
            for pkg in "${all[@]}"; do
              if echo "$changed" | grep -qE "^packages/${pkg}/"; then
                selected+=("$pkg")
              fi
            done
          fi

          if [ ${#selected[@]} -eq 0 ]; then
            echo "packages=[]" >> "$GITHUB_OUTPUT"
          else
            json=$(printf '%s\n' "${selected[@]}" | jq -R . | jq -sc .)
            echo "packages=$json" >> "$GITHUB_OUTPUT"
          fi

  protocol-types-sync:
    # Content mirrored from a single canonical source into many files — copies of
    # source files that live outside packages/* (protocol/wc-bindable.ts →
    # src/protocol/wcBindable.ts, config-templates/* → rollup.config.js /
    # eslint.config.js), and the per-package README AI-agents banner (canonical
    # text in scripts/sync-readme-agents-banner.mjs). The change-detection matrix
    # above cannot catch this drift, so this independent job fails if any mirror
    # drifts from its source (including a new package that ships without the banner).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-protocol-types.mjs --check
      - run: node scripts/sync-io-core.mjs --check
      - run: node scripts/sync-package-configs.mjs --check
      - run: node scripts/sync-readme-agents-banner.mjs --check
      # builtinTags カタログ + wcs.html-data.json が committed dist からの再生成と
      # 一致するか(audio/midi 追加時に 12 タグ分 stale だった鮮度罠の恒久ゲート)。
      # committed dist が入力なので npm ci 不要・src が dist より先行していても安定。
      - run: node packages/vscode-wcs/scripts/emit-builtin-tags.mjs --check

  bindable-conformance:
    # settable wcBindable member ⇒ declared in inputs. A runtime check that
    # imports each package's committed dist bundle and inspects the *evaluated*
    # declaration against the prototype chain's setters — so dynamically
    # generated wcBindable surfaces are covered too, which no source lint can
    # see (the router navigateUrl / DCC $bindables class of drift). Committed
    # dist lags src between releases; release.yml re-runs the same script after
    # the version-bump rebuild so fresh bundles are re-gated before publish.
    # This job installs nothing, so a bundle importing an external bare
    # specifier (server externalizes happy-dom) is skipped here with a note and
    # fully checked in the release.yml re-run, which follows per-package npm ci.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/conformance-bindable-inputs.mjs

  wcs-validate:
    # Phase 5a 静的契約の CI ゲート。vscode-wcs の validator core を wcs-validate CLI
    # 経由で repo の HTML / sidecar manifest に適用し、error severity の診断があれば
    # build を落とす（spread 構文 / path / modifier / 壊れ manifest 等）。
    # <wcs-state src=...> の外部 state は CLI が HTML 相対で読み込んで解決する。
    # それでも解決できないパスは warning に留まり build を落とさない（--errors-only で表示も抑制）。
    # vscode-wcs は @wcstack/* でなく detect-changes matrix 対象外なので独立 job にする。
    #
    # vscode-wcs / lint は @wcstack/state の dist を file:../state（symlink）経由で
    # inline して消費する。コミット済み dist はリリース間で src に遅行するため、最初に
    # state を src から再ビルドし、「新鮮な state × vscode-wcs / lint」を PR 時点で
    # ゲートする（#183 の残り半分 — stale dist に対して緑のまま release で初めて落ちる
    # 経路を塞ぐ。docs/distribution-robustness-impl-plan.md Phase 2）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/vscode-wcs/package-lock.json
            packages/state/package-lock.json
      # node_modules/@wcstack/state は npm の file: 依存で symlink になるため、
      # vscode-wcs の npm ci より先に走っても後から走っても新鮮な dist が見える。
      # esbuild の inline（vscode-wcs の build）より前であることだけが要件。
      - name: Build @wcstack/state from source (vscode-wcs and lint inline its dist)
        run: |
          npm ci
          npm run build
        working-directory: packages/state
      - run: npm ci
        working-directory: packages/vscode-wcs
      - run: npm run build
        working-directory: packages/vscode-wcs
      # vscode-wcs は detect-changes matrix 対象外のため、ユニットテスト
      # （コーパスパリティテスト含む — examples の HTML 追加が正本パーサ基盤を
      # 壊していないかのゲート）はこの job で実行する。
      - run: npm test
        working-directory: packages/vscode-wcs
      # @wcstack/lint はソースを持たず、vscode-wcs をビルドして cli.cjs をコピーする
      # だけのラッパー。挙動の正本は vscode-wcs にあるのに CLI 契約テストは lint 側に
      # あり、その ci matrix は「packages/lint/ が変更された PR」でしか動かない。
      # vscode-wcs は @wcstack/* でないので matrix にそもそも載らず、vscode-wcs だけを
      # 触る変更は lint の契約テストを一度も走らせないまま通る。実際 array-mutation の
      # severity 変更がこの穴を抜け、release の「Build all packages」で初めて落ちた。
      # vscode-wcs の変更で必ず動くこの job から走らせて塞ぐ。冒頭の state 再ビルドに
      # より、この smoke も state の src 変更に対して新鮮な dist で走る。
      - name: Smoke-test the packaged CLI against the freshly built dist
        run: |
          set -euo pipefail
          npm run build
          npm test
        working-directory: packages/lint
      - name: Validate data-wcs bindings (error severity fails the build)
        run: |
          set -euo pipefail
          find examples packages \
            -type d \( -name node_modules -o -name dist -o -name coverage -o -name .tsc-out \) -prune \
            -o -type f \( -name '*.html' -o -name '*.manifest.json' \) -print0 \
            | xargs -0 -r -n 100 node packages/vscode-wcs/dist/cli.cjs --errors-only

  ci:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck --if-present
      - run: npm run size --if-present
      - run: npm run test:coverage
