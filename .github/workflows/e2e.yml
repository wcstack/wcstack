name: E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "examples/**"
      - "packages/**/dist/**"
      - "packages/**/src/**"
      # @wcstack/state's esbuild pipeline: its bundles change with these too
      - "packages/state/build.mjs"
      - "packages/state/mangle.mjs"
      - "packages/state/minify.mjs"
      - "e2e/**"
      # A change to this workflow must run it, or the change lands untested.
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # serve.mjs rewrites the examples' CDN URLs to packages/*/dist so the suite
      # exercises this tree rather than whatever esm.run last published — but dist
      # is only committed on release, so without a build here the pages would load
      # the last released bundles and the suite would silently validate stale code.
      # An example that depends on an unreleased fix fails; worse, a regression
      # introduced in src passes.
      #
      # Which packages need rebuilding is read off the tree, not off this PR's
      # diff: a package is stale whenever its src — or a build script at its
      # root that shapes the bundles (@wcstack/state's build.mjs, mangle.mjs and
      # minify.mjs: a name added to the mangle list changes every bundle without
      # a src change) — moved after its dist was last committed. Diffing against the PR base got this wrong as soon as src
      # changes piled up between releases — a PR touching only tests or another
      # package left the stale dist in place and the suite ran the last release's
      # bundles (the DCC e2e specs failing on PR #136). Reading the tree also
      # makes workflow_dispatch behave like a PR run instead of always falling
      # back to the committed dist.
      - name: Build the dist bundles of packages whose src outpaces their dist
        working-directory: .
        run: |
          set -euo pipefail

          built=0
          for dir in packages/*/; do
            [ -f "${dir}package.json" ] || continue
            name=$(node -p "require('./${dir}package.json').name")
            case "$name" in
              @wcstack/*) ;;
              *) continue ;;
            esac
            pkg=$(basename "$dir")
            distSha=$(git log -1 --format=%H -- "${dir}dist")
            inputs=("${dir}src" "${dir}build.mjs" "${dir}mangle.mjs" "${dir}minify.mjs")
            # A package that has never committed a dist has nothing to compare
            # against; build it so the suite never loads a missing bundle.
            if [ -n "$distSha" ]; then
              # A change to the shared root tsconfig rebuilds every package.
              if [ -z "$(git log --oneline "${distSha}..HEAD" -- "${inputs[@]}")" ] \
                && [ -z "$(git log --oneline "${distSha}..HEAD" -- tsconfig.json)" ]; then
                continue
              fi
            fi
            echo "::group::build ${pkg}"
            (cd "$dir" && npm ci && npm run build)
            echo "::endgroup::"
            built=$((built + 1))
          done
          echo "rebuilt ${built} package(s)"
      # serve.mjs renders /ssr-router/* through packages/server/dist at request
      # time, and that bundle imports `happy-dom` from packages/server/node_modules.
      # The loop above only runs `npm ci` inside a package it rebuilds, so on a
      # tree where every dist is fresh — right after a release commits them —
      # nothing is installed, renderToString throws, and every ssr-router spec
      # fails with "Bad Request" (PRs #214–#219 right after v1.32.0, with
      # `rebuilt 0 package(s)`). Install the runtime dependencies of every
      # published package that declares some whenever the loop left them out.
      - name: Install the runtime dependencies the committed dists import at request time
        working-directory: .
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            [ -f "${dir}package.json" ] || continue
            name=$(node -p "require('./${dir}package.json').name")
            case "$name" in
              @wcstack/*) ;;
              *) continue ;;
            esac
            deps=$(node -p "Object.keys(require('./${dir}package.json').dependencies || {}).length")
            [ "$deps" -gt 0 ] || continue
            [ -d "${dir}node_modules" ] && continue
            echo "::group::install runtime dependencies of $(basename "$dir")"
            (cd "$dir" && npm ci --omit=dev)
            echo "::endgroup::"
          done
      # examples/fw-inventory is a Vite app (React and Vue from npm), served from its dist/ by its
      # own server.js. WCS_LOCAL=1 points its @wcstack/* imports at packages/*/dist, which the first
      # step rebuilt from src, so e2e/tests/fw-inventory.spec.ts runs this tree's bundles.
      - name: Build the fw-inventory seam app over the packages' dists
        working-directory: examples/fw-inventory
        run: npm ci && WCS_LOCAL=1 npm run build
      # examples/prod-booking deploys v2 over v1 while a tab is open. v1 is the published @wcstack/* 4.6.2, served
      # from the example's own node_modules; v2 is packages/*/dist (WCS_LOCAL=1), so its spec needs no CDN.
      - name: Install the prod-booking seam app's published packages (its v1)
        working-directory: examples/prod-booking
        run: npm ci
      # examples/shift-desk's server needs `ws` for the chat; its pages load packages/*/dist under WCS_LOCAL=1.
      - name: Install the shift-desk seam app's server dependency
        working-directory: examples/shift-desk
        run: npm ci
      # examples/homeroom keeps the app as written on 4.2.0 beside the current one. Its server needs `ws`, and under
      # WCS_LOCAL=1 it serves the 4.2.0 copy the published @wcstack/* 4.2.0 from the example's own node_modules (npm
      # aliases) and the current copy packages/*/dist, so its spec needs no CDN. The devDependencies are its Vitest suite's.
      - name: Install the homeroom seam app's server dependency and its 4.2.0 packages
        working-directory: examples/homeroom
        run: npm ci --omit=dev
      - run: npm ci
      # firefox: the "firefox" project runs prod-booking's checks where browsers differ (import map
      # integrity, Trusted Types) — e2e/playwright.config.ts
      - run: npx playwright install --with-deps chromium firefox
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7
