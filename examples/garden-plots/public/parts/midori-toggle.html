<!--
  みどり市 共通部品 <midori-toggle> — an on/off switch around a real checkbox.
  Designers: edit the <style> and the markup below; the state is the small object at the bottom.

  Use:   <midori-toggle data-wcs="checked: settings.notifySaved">保存したら通知する</midori-toggle>
         <midori-toggle data-wcs="checked: plot.paused; disabled: busy">休止</midori-toggle>
  Bindable: checked (both directions), disabled. The label is the content.
-->
<midori-toggle data-wc-definition>
  <template shadowrootmode="open">
    <style>
      :host { display: inline-block; }
      :host([hidden]) { display: none; }
      label { display: inline-flex; align-items: center; gap: 0.55em; cursor: pointer; user-select: none; }
      input { position: absolute; opacity: 0; width: 2.6em; height: 1.4em; margin: 0; cursor: pointer; }
      .track { position: relative; flex: none; width: 2.6em; height: 1.4em; border-radius: 999px;
        background: var(--midori-toggle-off, #9aa3ad); transition: background 0.15s; }
      .thumb { position: absolute; top: 0.15em; left: 0.15em; width: 1.1em; height: 1.1em; border-radius: 50%;
        background: var(--midori-surface, #fff); box-shadow: 0 1px 2px rgb(0 0 0 / 0.35); transition: transform 0.15s; }
      input:checked + .track { background: var(--midori-toggle-on, #2e8b47); }
      input:checked + .track .thumb { transform: translateX(1.2em); }
      input:focus-visible + .track { outline: 3px solid var(--midori-focus, #1a73e8); outline-offset: 2px; }
      input:disabled, input:disabled ~ * { cursor: default; opacity: 0.5; }
      .state { font-size: 0.8em; color: var(--midori-muted, #4a5260); min-width: 2em; }
      @media (forced-colors: active) { .track { border: 1px solid CanvasText; } input:checked + .track { background: Highlight; } }
    </style>
    <label>
      <input type="checkbox" role="switch" data-wcs="checked: checked; disabled: disabled">
      <span class="track" aria-hidden="true"><span class="thumb"></span></span>
      <span class="text"><slot></slot></span>
      <span class="state" aria-hidden="true" data-wcs="textContent: stateLabel"></span>
    </label>
    <wcs-state>
      <script type="module">
        export default {
          checked: false,
          disabled: false,
          get stateLabel() { return this.checked ? "オン" : "オフ"; },
          $bindables: ["checked", "disabled"],
        };
      </script>
    </wcs-state>
  </template>
</midori-toggle>
